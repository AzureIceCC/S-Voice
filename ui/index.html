<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Voice — Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>S-Voice</h1>
      <span class="badge" id="state-badge">idle</span>
    </header>

    <section>
      <label id="hotkey-label">全局热键</label>
      <div class="row">
        <input type="text" id="hotkey" readonly>
        <button id="record-hotkey" class="btn-secondary">录制</button>
        <button id="clear-hotkey" class="btn-secondary" hidden>✕</button>
      </div>
      <p class="hint" id="hotkey-hint">支持单键或组合键（Cmd+[）</p>
    </section>

    <section>
      <label id="ui-language-label">显示语言</label>
      <select id="ui-language"><option value="zh">中文</option><option value="en">English</option></select>
    </section>

    <section>
      <label id="stt-language-label">STT 语言</label>
      <select id="language">
        <option id="auto-language" value="auto" selected>自动检测</option>
        <option value="zh">中文 (zh)</option>
        <option value="en">English (en)</option>
        <option value="ja">日本語 (ja)</option>
      </select>
    </section>

    <section>
      <label id="backend-label">语音识别后端</label>
      <select id="stt-backend">
        <option id="apple-option" value="apple_speech" selected>Apple SpeechAnalyzer（系统本地）</option>
        <option id="whisper-option" value="local_whisper">本地 Whisper（离线）</option>
      </select>
      <p class="hint" id="backend-hint">后端选择是显式的；所选后端失败时不会自动切换。</p>
    </section>

    <section>
      <label id="stt-model-label">本地 Whisper 模型</label>
      <input type="text" id="stt-model">
    </section>

    <section>
      <label id="mode-label">转写模式</label>
      <div class="row" id="streaming-mode">
        <label class="checkbox">
          <input type="radio" name="streaming" value="off" id="streaming-off" checked>
          <span id="once-label">一次性转写（稳定，推荐）</span>
        </label>
        <label class="checkbox" id="realtime-label-wrap">
          <input type="radio" name="streaming" value="on" id="streaming-on" disabled>
          <span id="realtime-label">实时转写（开发中）</span>
        </label>
      </div>
      <p class="hint" id="streaming-hint">实时转写暂未启用</p>
    </section>

    <section>
      <h2 id="polish-title">Ollama 润色</h2>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="polish-enabled" checked>
          <span id="polish-label">启用 LLM 润色</span>
        </label>
      </div>
      <label id="ollama-model-label">Ollama 模型</label>
      <input type="text" id="ollama-model">
      <label id="keepalive-label">Keep-alive (空闲多久后卸载)</label>
      <input type="text" id="ollama-keepalive" placeholder="30m">
      <details>
        <summary id="prompt-summary">自定义润色 prompt（留空使用默认）</summary>
        <textarea id="polish-prompt" rows="6"></textarea>
      </details>
    </section>

    <section>
      <h2 id="diagnostic-title">诊断</h2>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="debug">
          <span id="debug-label">Debug 模式（详细日志）</span>
        </label>
      </div>
      <label id="log-label">日志文件路径</label>
      <div class="row">
        <input type="text" id="log-path" readonly>
        <button id="open-log-dir" class="btn-secondary">在 Finder 中显示</button>
      </div>
    </section>

    <section class="actions">
      <button id="save" class="btn-primary">保存</button>
      <button id="reload" class="btn-secondary">从磁盘重新加载</button>
      <button id="test-stt" class="btn-secondary">测试 STT 连接</button>
      <button id="test-polish" class="btn-secondary">测试润色</button>
    </section>

    <section id="status" class="status" hidden></section>
  </div>

  <script src="tauri.js"></script>
  <script src="app.js"></script>
</body>
</html>
