[package]
name = "s-voice"
version = "0.2.1"
description = "Local AI voice input: hold hotkey, speak, get polished text"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "s_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

cpal = "0.15"
hound = "3"
dirs = "5"
# macOS-only: CGEventPost for direct synthetic keystroke, ~10-30ms vs the
# ~100-500ms osascript/AppleScript path. Requires Accessibility permission
# (one-time grant in System Settings → Privacy & Security → Accessibility).
core-graphics = "0.25"

thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.aarch64-apple-darwin.dependencies]
tracing-oslog = "0.3.0"
