<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Voice — Settings (Mockup)</title>
  <link rel="stylesheet" href="../ui/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>S-Voice</h1>
      <span class="badge" id="state-badge">idle</span>
    </header>

    <section>
      <label>全局热键</label>
      <div class="row">
        <input type="text" id="hotkey" value="Cmd+Shift+Space" readonly>
        <button id="record-hotkey" class="btn-secondary">录制</button>
        <button id="clear-hotkey" class="btn-secondary">✕</button>
      </div>
      <p class="hint">支持单键或组合键（Cmd+Shift+Space）</p>
    </section>

    <section>
      <label>STT 语言</label>
      <select id="language">
        <option value="auto" selected>自动检测</option>
        <option value="zh">中文 (zh)</option>
        <option value="en">English (en)</option>
        <option value="ja">日本語 (ja)</option>
      </select>
    </section>

    <section>
      <label>STT 模型</label>
      <input type="text" id="stt-model" value="mlx-community/belle-whisper-large-v3-turbo-zh-fp16">
    </section>

    <section>
      <h2>Ollama 润色</h2>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="polish-enabled" checked>
          <span>启用 LLM 润色</span>
        </label>
      </div>
      <label>Ollama 模型</label>
      <input type="text" id="ollama-model" value="qwen3.5:9b-mlx">
      <label>Keep-alive (空闲多久后卸载)</label>
      <input type="text" id="ollama-keepalive" value="30m">
      <details>
        <summary>自定义润色 prompt（留空使用默认）</summary>
        <textarea id="polish-prompt" rows="6"></textarea>
      </details>
    </section>

    <section>
      <h2>诊断</h2>
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="debug" checked>
          <span>Debug 模式（详细日志，写入 ~/Library/Logs/S-Voice/）</span>
        </label>
      </div>
      <label>日志文件路径</label>
      <div class="row">
        <input type="text" id="log-path" value="~/Library/Logs/S-Voice/s-voice.log" readonly>
        <button id="open-log-dir" class="btn-secondary">在 Finder 中显示</button>
      </div>
    </section>

    <section class="actions">
      <button id="save" class="btn-primary">保存</button>
      <button id="test-stt" class="btn-secondary">测试 STT 连接</button>
      <button id="test-polish" class="btn-secondary">测试润色</button>
    </section>

    <section id="status" class="status success">已保存</section>
  </div>
</body>
</html>
